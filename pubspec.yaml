name: bluchet
description: Kulcskód secure messaging client scaffold
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.9.1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  cryptography: ^2.7.0
  flutter_local_notifications: ^19.4.2
  flutter_webrtc: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
