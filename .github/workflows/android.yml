
name: Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        
      - name: Verify Supabase URL and anon key
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/" > /tmp/supabase-health.json

          echo "Supabase URL and anon key are valid."
        
      - name: Generate Android platform
        run: flutter create --platforms=android .
        
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kulcskod-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
