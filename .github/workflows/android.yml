name: Flutter Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_ANON_KEY"; exit 1; }
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "Invalid SUPABASE_URL"; exit 1 ;;
          esac

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Configure core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if gradle_file is None:
              sys.exit("ERROR: Android Gradle file not found.")

          text = gradle_file.read_text()
          kotlin_dsl = gradle_file.suffix == ".kts"

          # Enable desugaring in compileOptions.
          if not re.search(
              r"\bisCoreLibraryDesugaringEnabled\b|\bcoreLibraryDesugaringEnabled\b",
              text
          ):
              match = re.search(
                  r"(?m)^([ \t]*)compileOptions\s*\{",
                  text
              )

              if not match:
                  sys.exit("ERROR: compileOptions block not found.")

              setting = (
                  "isCoreLibraryDesugaringEnabled = true"
                  if kotlin_dsl
                  else "coreLibraryDesugaringEnabled true"
              )

              pos = match.end()
              text = (
                  text[:pos]
                  + "\n        " + setting
                  + text[pos:]
              )

          # Create dependencies block if missing, otherwise append dependency.
          if "desugar_jdk_libs" not in text:
              dependency = (
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                  if kotlin_dsl
                  else 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
              )

              match = re.search(
                  r"(?m)^([ \t]*)dependencies\s*\{",
                  text
              )

              if match:
                  pos = match.end()
                  text = (
                      text[:pos]
                      + "\n    " + dependency
                      + text[pos:]
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      + "    " + dependency + "\n"
                      + "}\n"
                  )

          gradle_file.write_text(text)

          print(f"Updated: {gradle_file}")
          print("Desugaring dependency configured.")
          PY

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
    
      - name: Debug AndroidManifest
        run: |
          echo "=== Manifest path ==="
          pwd
          echo "=== XML content ==="
          cat -n android/app/src/main/AndroidManifest.xml
          echo "=== XML validation ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("XML syntax OK")
          PY
    
      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Verify Android manifest in APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK" || {
            echo "ERROR: APK not found"
            exit 1
          }

          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKTOOL="$SDK_DIR/build-tools/$(ls "$SDK_DIR/build-tools" | sort -V | tail -n 1)/aapt"

          if [ ! -x "$APKTOOL" ]; then
            echo "ERROR: aapt not found"
            exit 1
          fi

          "$APKTOOL" dump permissions "$APK" \
            | tee apk-permissions.txt

          "$APKTOOL" dump xmltree "$APK" \
            --file AndroidManifest.xml \
            | tee apk-manifest.txt

          echo "=== Manifest ellenőrzése ==="

          grep -E \
            'POST_NOTIFICATIONS|FOREGROUND_SERVICE|WAKE_LOCK|USE_FULL_SCREEN_INTENT|remoteMessaging|ForegroundService' \
            apk-permissions.txt apk-manifest.txt \
            || {
              echo "WARNING: Some expected entries are missing."
            }
            
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KulcsKod-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          TAG="v${VERSION:-1.0.0}-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "KulcsKod Android ${TAG}" \
            --notes "Automatikus Android build. Commit: ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
