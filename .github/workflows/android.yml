name: Flutter Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Install dependencies
    run: flutter pub get

  - name: Verify Supabase secrets
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    shell: bash
    run: |
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
        exit 1
      fi

      case "$SUPABASE_URL" in
        https://*) ;;
        *)
          echo "SUPABASE_URL must start with https://"
          exit 1
          ;;
      esac

      case "$SUPABASE_ANON_KEY" in
        sb_*) ;;
        *)
          echo "SUPABASE_ANON_KEY has unexpected format."
          exit 1
          ;;
      esac

      echo "Supabase secrets are present and valid."

  - name: Generate Android platform
    run: flutter create --platforms=android .

  - name: Configure core library desugaring
    shell: bash
    run: |
      python3 <<'PY'
      from pathlib import Path
      import re
      import sys

      candidates = [
          Path("android/app/build.gradle.kts"),
          Path("android/app/build.gradle"),
      ]

      file = next((p for p in candidates if p.is_file()), None)

      if file is None:
          print("ERROR: Android app Gradle file not found.")
          sys.exit(1)

      text = file.read_text()
      kotlin_dsl = file.suffix == ".kts"

      # Enable desugaring inside compileOptions.
      if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
          pattern = r"(?m)^([ \t]*)compileOptions[ \t]*\{"
          match = re.search(pattern, text)

          if not match:
              print("ERROR: compileOptions block not found.")
              print(text)
              sys.exit(1)

          indent = match.group(1) + "    "
          setting = (
              "isCoreLibraryDesugaringEnabled = true"
              if kotlin_dsl else
              "coreLibraryDesugaringEnabled true"
          )
          pos = match.end()
          text = text[:pos] + "\n" + indent + setting + text[pos:]

      # Add the dependency inside the app module's dependencies block.
      if "desugar_jdk_libs" not in text:
          pattern = r"(?m)^([ \t]*)dependencies[ \t]*\{"
          match = re.search(pattern, text)

          if not match:
              print("ERROR: dependencies block not found.")
              print(text)
              sys.exit(1)

          indent = match.group(1) + "    "
          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if kotlin_dsl else
              'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          )
          pos = match.end()
          text = text[:pos] + "\n" + indent + dependency + text[pos:]

      file.write_text(text)

      print(f"Updated {file}")
      print("Checking desugaring configuration...")

      if "desugar_jdk_libs:2.1.4" not in file.read_text():
          print("ERROR: Desugaring dependency was not added.")
          sys.exit(1)

      print("Desugaring configuration is present.")
      PY

  - name: Generate Launcher Icons
    run: dart run flutter_launcher_icons

  - name: Build APK
    run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: kulcskod-apk
      path: build/app/outputs/flutter-apk/app-release.apk
