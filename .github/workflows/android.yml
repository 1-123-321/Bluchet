name: Flutter Android APK

'on':
workflow_dispatch: {}
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Install dependencies
    run: flutter pub get

  - name: Verify Supabase secrets
    shell: bash
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is missing."
        exit 1
      fi

      case "$SUPABASE_URL" in
        https://*) ;;
        *)
          echo "::error::SUPABASE_URL must start with https://"
          exit 1
          ;;
      esac

      case "$SUPABASE_ANON_KEY" in
        sb_*) ;;
        *)
          echo "::error::SUPABASE_ANON_KEY has unexpected format."
          exit 1
          ;;
      esac

      echo "Supabase secrets verified."

  - name: Generate Android platform
    run: flutter create --platforms=android .

  - name: Configure Android desugaring
    shell: bash
    run: |
      python3 <<'PY'
      from pathlib import Path
      import re
      import sys

      candidates = [
          Path("android/app/build.gradle.kts"),
          Path("android/app/build.gradle"),
      ]

      gradle_file = next(
          (path for path in candidates if path.is_file()),
          None
      )

      if gradle_file is None:
          print("::error::Android app Gradle file not found.")
          sys.exit(1)

      content = gradle_file.read_text()
      is_kotlin = gradle_file.suffix == ".kts"

      # Enable core library desugaring.
      if not re.search(
          r"\bisCoreLibraryDesugaringEnabled\b|\bcoreLibraryDesugaringEnabled\b",
          content
      ):
          match = re.search(
              r"(?m)^([ \t]*)compileOptions[ \t]*\{",
              content
          )

          if not match:
              print("::error::compileOptions block not found.")
              sys.exit(1)

          indent = match.group(1) + "    "
          setting = (
              "isCoreLibraryDesugaringEnabled = true"
              if is_kotlin
              else "coreLibraryDesugaringEnabled true"
          )

          position = match.end()
          content = (
              content[:position]
              + "\n" + indent + setting
              + content[position:]
          )

      # Add the actual dependency.
      if "desugar_jdk_libs" not in content:
          match = re.search(
              r"(?m)^([ \t]*)dependencies[ \t]*\{",
              content
          )

          if not match:
              print("::error::dependencies block not found.")
              sys.exit(1)

          indent = match.group(1) + "    "
          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if is_kotlin
              else 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          )

          position = match.end()
          content = (
              content[:position]
              + "\n" + indent + dependency
              + content[position:]
          )

      gradle_file.write_text(content)

      print(f"Updated {gradle_file}")
      print("Desugaring configuration:")
      print(content)

      if "desugar_jdk_libs" not in content:
          print("::error::Desugaring dependency is missing.")
          sys.exit(1)

      if not re.search(
          r"\bisCoreLibraryDesugaringEnabled\b|\bcoreLibraryDesugaringEnabled\b",
          content
      ):
          print("::error::Desugaring is not enabled.")
          sys.exit(1)

      print("Desugaring configuration verified.")
      PY

  - name: Generate Launcher Icons
    run: dart run flutter_launcher_icons

  - name: Build Release APK
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      flutter build apk --release \
        --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
        --dart-define="SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: kulcskod-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 7
