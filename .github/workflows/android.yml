name: Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac

          case "$SUPABASE_ANON_KEY" in
            sb_*) ;;
            *)
              echo "SUPABASE_ANON_KEY has unexpected format."
              exit 1
              ;;
          esac

          echo "Supabase secrets are present and valid."

      - name: Generate Android platform
        run: flutter create --platforms=android .
      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Enable core library desugaring
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' android/app/build.gradle
          else
            echo "Android Gradle build file not found!"
            exit 1
          fi
          
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kulcskod-apk
          path: build/app/outputs/flutter-apk/app-release.apk
